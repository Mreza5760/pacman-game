name: Build Pacman (Cross‑platform)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------------
  # Windows: patch CMakeLists.txt to use static raylib (no find_package)
  # ------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download static raylib (MinGW)
        run: |
          curl -L -o raylib.zip https://github.com/raysan5/raylib/releases/download/5.0/raylib-5.0_win64_mingw-w64.zip
          unzip raylib.zip -d raylib
          echo "RAYLIB_PATH=$env:GITHUB_WORKSPACE\raylib\raylib-5.0_win64_mingw-w64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Patch CMakeLists.txt for Windows
        shell: pwsh
        run: |
          # Read original
          $cmake = Get-Content CMakeLists.txt -Raw
          # Remove the find_package line and the target_link_libraries that follows it
          $cmake = $cmake -replace 'find_package\(raylib REQUIRED CONFIG\)\s*target_link_libraries\(\${PROJECT_NAME} PRIVATE raylib\)', ''
          # Append manual static linking block
          $block = @"

          # ----- STATIC LINKING FOR WINDOWS (injected) -----
          if(WIN32)
              set(RAYLIB_PATH `$ENV{RAYLIB_PATH})
              target_include_directories(`${PROJECT_NAME} PRIVATE `${RAYLIB_PATH}/include)
              target_link_directories(`${PROJECT_NAME} PRIVATE `${RAYLIB_PATH}/lib)
              target_link_libraries(`${PROJECT_NAME} PRIVATE raylib winmm gdi32)
          else()
              find_package(raylib REQUIRED CONFIG)
              target_link_libraries(`${PROJECT_NAME} PRIVATE raylib)
          endif()
          "@
          $cmake += $block
          Set-Content CMakeLists.txt -Value $cmake -Encoding ascii

      - name: Embed assets
        run: python scripts/embed_assets.py

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Windows.exe
          path: build/Release/Pacman.exe

  # ------------------------------------------------------------------------
  # Linux: build static raylib from source (proven to work)
  # ------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev

      - name: Build static raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install

      - name: Embed assets
        run: python3 scripts/embed_assets.py

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Linux
          path: build/Pacman

  # ------------------------------------------------------------------------
  # macOS: build static raylib + add required frameworks
  # ------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install CMake
        run: brew install cmake

      - name: Build static raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Patch CMakeLists.txt for macOS (append frameworks)
        run: |
          cat >> CMakeLists.txt << 'EOF'
          # macOS: link required Objective-C frameworks
          target_link_libraries(${PROJECT_NAME} PRIVATE
              "-framework Foundation"
              "-framework Cocoa"
              "-framework IOKit"
              "-framework CoreVideo"
          )
          EOF
        shell: bash

      - name: Embed assets
        run: python3 scripts/embed_assets.py

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-macOS
          path: build/Pacman
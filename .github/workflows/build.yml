name: Build Pacman for all platforms

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:                 # allows manual trigger

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false               # run all platforms even if one fails
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows-static
            vcpkg_pkgs: "raylib"
            exe_ext: ".exe"
            build_dir: "build/Release"
          - os: ubuntu-latest
            triplet: x64-linux
            vcpkg_pkgs: ""
            exe_ext: ""
            build_dir: "build"
          - os: macos-latest
            triplet: x64-osx
            vcpkg_pkgs: ""
            exe_ext: ""
            build_dir: "build"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ------------------------------------------------------------
      # Windows: install raylib via vcpkg (static)
      # ------------------------------------------------------------
      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 501db0f17ef6df184fcdbfbe0f87cde2313b6ab1

      - name: Install raylib (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install raylib:${{ matrix.triplet }}

      # ------------------------------------------------------------
      # Linux: install system dependencies
      # ------------------------------------------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y cmake libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev

      # ------------------------------------------------------------
      # macOS: install dependencies
      # ------------------------------------------------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      # ------------------------------------------------------------
      # Generate embedded assets (same for all)
      # ------------------------------------------------------------
      - name: Embed assets
        run: |
          python3 scripts/embed_assets.py
        shell: bash

      # ------------------------------------------------------------
      # Configure CMake
      # ------------------------------------------------------------
      - name: Configure CMake
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          mkdir -p build
          cd build
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake .. -DCMAKE_BUILD_TYPE=Release \
                     -DBUILD_SHARED_LIBS=OFF \
                     -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
                     -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          else
            cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          fi
        shell: bash

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build
        run: |
          cd build
          cmake --build . --config Release
        shell: bash

      # ------------------------------------------------------------
      # Upload executable
      # ------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-${{ runner.os }}${{ matrix.exe_ext }}
          path: ${{ matrix.build_dir }}/Pacman${{ matrix.exe_ext }}
name: Build Pacman Game (Cross‑Platform)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install vcpkg and static raylib
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg integrate install
          .\vcpkg install raylib:x64-windows-static
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Embed assets (generate C arrays)
        shell: pwsh
        run: |
            Write-Host "=== Python version ==="
            python --version
            Write-Host "=== Test Python works ==="
            python -c "print('Python is working')"
            Write-Host "=== List all asset files ==="
            Get-ChildItem assets -Recurse -File | Select-Object FullName
            Write-Host "=== Check script file exists and is readable ==="
            Get-Content scripts/embed_assets.py -TotalCount 5
            Write-Host "=== Run script with traceback and unbuffered output ==="
            python -u scripts/embed_assets.py 2>&1 | ForEach-Object { Write-Host $_ }
            $exitCode = $LASTEXITCODE
            Write-Host "Exit code: $exitCode"
            if ($exitCode -ne 0) {
                Write-Host "Script failed. Trying to run with -m trace..."
                python -m trace --trace scripts/embed_assets.py 2>&1 | Select-Object -First 50
                exit $exitCode
            }
            Write-Host "=== Checking generated files ==="
            if (Test-Path src/embedded_assets.c) { Write-Host "SUCCESS" } else { Write-Host "FAIL: src/embedded_assets.c missing" }
            if (Test-Path src/embedded_assets.h) { Write-Host "SUCCESS" } else { Write-Host "FAIL: src/embedded_assets.h missing" }

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE"

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Windows
          path: build/Release/Pacman.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Build static raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install

      - name: Embed assets
        run: |
          python3 scripts/embed_assets.py
          if [ $? -ne 0 ]; then exit 1; fi
          ls -la src/embedded_assets.c || (echo "embedded_assets.c not generated" && exit 1)

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Linux
          path: build/Pacman

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install CMake
        run: brew install cmake

      - name: Build static raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Embed assets
        run: |
          python3 scripts/embed_assets.py
          if [ $? -ne 0 ]; then exit 1; fi
          ls -la src/embedded_assets.c || (echo "embedded_assets.c not generated" && exit 1)

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-macOS
          path: build/Pacman
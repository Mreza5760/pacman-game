name: Build Pacman Game (Cross‑Platform)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install vcpkg and static raylib
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg integrate install
          .\vcpkg install raylib:x64-windows-static
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Debug – list files before embedding
        run: |
          echo "Current directory:"
          pwd
          echo "Contents:"
          dir
          echo "Assets folder:"
          dir assets || echo "assets/ not found"
          echo "Scripts folder:"
          dir scripts || echo "scripts/ not found"

      - name: Embed assets (generate C arrays)
        run: |
          echo "=== Debug Info ==="
          echo "Current directory: $(pwd)"
          echo "Files in root:"
          dir
          echo "Assets folder:"
          dir assets 2>&1 || echo "ERROR: assets folder missing"
          echo "Scripts folder:"
          dir scripts 2>&1 || echo "ERROR: scripts folder missing"
          echo "Python version:"
          python --version
          echo "=== Running Python script ==="
          python -u scripts/embed_assets.py > output.txt 2>&1
          set ERRORLEVEL=%errorlevel%
          type output.txt
          echo "Exit code: %ERRORLEVEL%"
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          echo "=== Checking generated files ==="
          if exist src\embedded_assets.c (echo "SUCCESS: src/embedded_assets.c created") else (echo "FAIL: src/embedded_assets.c not created")
          if exist src\embedded_assets.h (echo "SUCCESS: src/embedded_assets.h created") else (echo "FAIL: src/embedded_assets.h not created")
    
      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE"

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Windows
          path: build/Release/Pacman.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Build static raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install

      - name: Debug – list files
        run: |
          pwd
          ls -la
          ls -la assets/ || echo "assets/ missing"
          ls -la scripts/ || echo "scripts/ missing"

      - name: Embed assets
        run: |
          python3 scripts/embed_assets.py 2>&1
          if [ $? -ne 0 ]; then exit 1; fi
          ls -la src/embedded_assets.c || echo "embedded_assets.c NOT generated"

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Linux
          path: build/Pacman

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install CMake
        run: brew install cmake

      - name: Build static raylib (macOS)
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Debug – list files
        run: |
          pwd
          ls -la
          ls -la assets/ || echo "assets/ missing"
          ls -la scripts/ || echo "scripts/ missing"

      - name: Embed assets
        run: |
          python3 scripts/embed_assets.py 2>&1
          if [ $? -ne 0 ]; then exit 1; fi
          ls -la src/embedded_assets.c || echo "embedded_assets.c NOT generated"

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-macOS
          path: build/Pacman
name: Build Pacman (Cross‑platform)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Windows – vcpkg + static raylib (verbose)
  # --------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 501db0f17ef6df184fcdbfbe0f87cde2313b6ab1

      - name: Install raylib (static) – verbose
        run: |
          vcpkg install raylib:x64-windows-static --debug
          echo "VCPKG_ROOT=$env:VCPKG_ROOT"
          dir "$env:VCPKG_ROOT\installed\x64-windows-static"
        shell: cmd

      - name: Embed assets
        run: python scripts/embed_assets.py

      - name: Configure CMake (verbose)
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release `
                   -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
                   -DVCPKG_TARGET_TRIPLET=x64-windows-static `
                   --trace-expand 2>&1 | Out-File cmake_log.txt
          type cmake_log.txt
        shell: pwsh

      - name: Build
        run: |
          cd build
          cmake --build . --config Release --verbose

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Windows.exe
          path: build/Release/Pacman.exe

  # --------------------------------------------------------------------------
  # Linux – build raylib from source (proven)
  # --------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev

      - name: Build static raylib (source)
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install
          # Verify installation
          ls -la /usr/local/lib/libraylib.a

      - name: Embed assets
        run: python3 scripts/embed_assets.py

      - name: Configure CMake (verbose)
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release --trace-expand 2>&1 | tee cmake_log.txt
          cat cmake_log.txt

      - name: Build (verbose)
        run: |
          cd build
          make VERBOSE=1 -j$(nproc)

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Linux
          path: build/Pacman

  # --------------------------------------------------------------------------
  # macOS – build raylib from source (proven)
  # --------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install CMake
        run: brew install cmake

      - name: Build static raylib (source)
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          make -j$(sysctl -n hw.ncpu)
          sudo make install
          ls -la /usr/local/lib/libraylib.a

      - name: Embed assets
        run: python3 scripts/embed_assets.py

      - name: Configure CMake (verbose)
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release --trace-expand 2>&1 | tee cmake_log.txt
          cat cmake_log.txt

      - name: Build (verbose)
        run: |
          cd build
          make VERBOSE=1 -j$(sysctl -n hw.ncpu)

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-macOS
          path: build/Pacman
name: Build Pacman (Cross‑platform)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # Windows: use base64 encoded CMakeLists.txt (manual static linking)
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download static raylib (Windows)
        run: |
          curl -L -o raylib.zip https://github.com/raysan5/raylib/releases/download/5.0/raylib-5.0_win64_mingw-w64.zip
          unzip raylib.zip -d raylib
          echo "RAYLIB_PATH=$env:GITHUB_WORKSPACE\raylib\raylib-5.0_win64_mingw-w64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Replace CMakeLists.txt with static version (base64)
        shell: pwsh
        run: |
          $base64 = ""
          $bytes = [System.Convert]::FromBase64String($base64)
          $content = [System.Text.Encoding]::UTF8.GetString($bytes)
          Set-Content CMakeLists.txt -Value $content -Encoding utf8

      - name: Embed assets
        run: python scripts/embed_assets.py

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Windows.exe
          path: build/Release/Pacman.exe

  # Linux: unchanged (works)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev

      - name: Build static raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install

      - name: Embed assets
        run: python3 scripts/embed_assets.py

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Linux
          path: build/Pacman

  # macOS: works with framework patch
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install CMake
        run: brew install cmake

      - name: Build static raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Patch CMakeLists.txt for macOS (append frameworks)
        run: |
          cat >> CMakeLists.txt << 'EOF'
          # macOS: link required Objective-C frameworks
          target_link_libraries(${PROJECT_NAME} PRIVATE
              "-framework Foundation"
              "-framework Cocoa"
              "-framework IOKit"
              "-framework CoreVideo"
          )
          EOF
        shell: bash

      - name: Embed assets
        run: python3 scripts/embed_assets.py

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-macOS
          path: build/Pacman
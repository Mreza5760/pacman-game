name: Build Pacman (Cross‑platform)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  # Windows: patch CMakeLists.txt to use manual linking
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download static raylib (Windows)
        run: |
          curl -L -o raylib.zip https://github.com/raysan5/raylib/releases/download/5.0/raylib-5.0_win64_mingw-w64.zip
          unzip raylib.zip -d raylib
          echo "RAYLIB_PATH=$env:GITHUB_WORKSPACE\raylib\raylib-5.0_win64_mingw-w64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Patch CMakeLists.txt for Windows
        run: |
          findstr /v "find_package(raylib REQUIRED CONFIG)" CMakeLists.txt > CMakeLists.txt.tmp
          echo "if(WIN32)" >> CMakeLists.txt.tmp
          echo "    target_include_directories(${PROJECT_NAME} PRIVATE $env:RAYLIB_PATH/include)" >> CMakeLists.txt.tmp
          echo "    target_link_directories(${PROJECT_NAME} PRIVATE $env:RAYLIB_PATH/lib)" >> CMakeLists.txt.tmp
          echo "    target_link_libraries(${PROJECT_NAME} PRIVATE raylib winmm gdi32)" >> CMakeLists.txt.tmp
          echo "elseif(APPLE)" >> CMakeLists.txt.tmp
          echo "    find_package(raylib REQUIRED CONFIG)" >> CMakeLists.txt.tmp
          echo "    target_link_libraries(${PROJECT_NAME} PRIVATE raylib \"-framework Foundation\" \"-framework Cocoa\" \"-framework IOKit\" \"-framework CoreVideo\")" >> CMakeLists.txt.tmp
          echo "else()" >> CMakeLists.txt.tmp
          echo "    find_package(raylib REQUIRED CONFIG)" >> CMakeLists.txt.tmp
          echo "    target_link_libraries(${PROJECT_NAME} PRIVATE raylib)" >> CMakeLists.txt.tmp
          echo "endif()" >> CMakeLists.txt.tmp
          move /Y CMakeLists.txt.tmp CMakeLists.txt
        shell: cmd

      - name: Embed assets
        run: python scripts/embed_assets.py

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Windows.exe
          path: build/Release/Pacman.exe

  # Linux: build static raylib from source (proven to work)
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev

      - name: Build static raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          sudo make install

      - name: Embed assets
        run: python3 scripts/embed_assets.py

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-Linux
          path: build/Pacman

  # macOS: build static raylib from source + add frameworks
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install CMake
        run: brew install cmake

      - name: Build static raylib
        run: |
          git clone https://github.com/raysan5/raylib.git
          cd raylib
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: Patch CMakeLists.txt for macOS (add frameworks)
        run: |
          # Add the framework link lines after the find_package line
          sed -i '' '/find_package(raylib REQUIRED CONFIG)/a\
          target_link_libraries(${PROJECT_NAME} PRIVATE "-framework Foundation" "-framework Cocoa" "-framework IOKit" "-framework CoreVideo")
          ' CMakeLists.txt
        shell: bash

      - name: Embed assets
        run: python3 scripts/embed_assets.py

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          make -j$(sysctl -n hw.ncpu)

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: Pacman-macOS
          path: build/Pacman